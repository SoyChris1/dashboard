<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSports Dashboard Pro</title>
    <style>
        * { box-sizing: border-box; }

        body {
            background: #050505;
            color: #f5f5f5;
            font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            width: 780px;
            height: 540px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Botón de apoyo, esquina, discreto */
        .kofi-corner {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            text-decoration: none;
            color: #f5f5f5;
            transition: all 0.2s ease;
        }
        .kofi-corner:hover { background: #fff; color: #000; border-color: #fff; }

        .opciones-corner {
            position: absolute;
            top: 16px;
            right: 58px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            background: transparent;
            color: #f5f5f5;
            transition: all 0.2s ease;
        }
        .opciones-corner:hover { background: #fff; color: #000; border-color: #fff; }

        header { text-align: center; padding: 2px 0; margin-bottom: 16px; }

        header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #ffffff;
        }

        #reloj {
            font-size: 12px; color: #777; margin-top: 6px;
            font-weight: 500; font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }

        /* Pestañas de juego, con logo */
        .game-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            justify-content: center;
        }

        .game-tab {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            color: #999;
            padding: 7px 18px 7px 10px;
            border-radius: 22px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .game-tab img { width: 20px; height: 20px; border-radius: 50%; }

        .game-tab:hover { border-color: rgba(255,255,255,0.5); color: #fff; }

        .game-tab.active { background: #fff; color: #000; border-color: #fff; }

        /* Layout principal: rail izquierdo + panel de contenido */
        .main-layout {
            display: flex;
            gap: 18px;
            flex-grow: 1;
            min-height: 0;
        }

        .side-nav {
            width: 96px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .side-tab {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: #888;
            border-radius: 12px;
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .side-tab .icon { font-size: 20px; }

        .side-tab:hover { border-color: rgba(255,255,255,0.3); color: #fff; }

        .side-tab.active { background: #fff; color: #000; border-color: #fff; }

        .content-panel {
            flex-grow: 1;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 16px;
            padding: 20px;
            overflow-y: auto;
            min-width: 0;
        }

        /* Tarjeta de parche, con preview */
        .patch-card { display: flex; flex-direction: column; }

        .patch-preview {
            width: 100%;
            max-height: 160px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 14px;
            display: block;
            background: rgba(255,255,255,0.05);
        }

        .patch-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px; }

        .patch-meta { font-size: 11px; color: #777; margin-bottom: 10px; }

        .patch-desc { font-size: 13px; color: #bbb; line-height: 1.6; margin-bottom: 14px; }

        .patch-link {
            align-self: flex-start;
            font-size: 12px;
            font-weight: 700;
            color: #000;
            background: #fff;
            padding: 8px 16px;
            border-radius: 18px;
            text-decoration: none;
        }
        .patch-link:hover { background: #ddd; }

        /* Lista de partidos */
        .match-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 4px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .match-row:last-child { border-bottom: none; }

        .match-teams { font-size: 14px; font-weight: 700; color: #fff; }
        .match-meta { font-size: 11px; color: #777; margin-top: 3px; }

        .empty-state { color: #555; font-style: italic; text-align: center; padding: 40px 8px; font-size: 12.5px; }

        #estado-actualizacion {
            text-align: center;
            font-size: 10px;
            color: #444;
            margin-top: 12px;
        }

        /* Modal de configuración, dentro del mismo popup */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            border-radius: 18px;
        }

        .modal-overlay.oculto { display: none; }

        .modal-box {
            background: #111;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 24px;
            width: 300px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .modal-header span {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .modal-header button {
            background: transparent;
            border: none;
            color: #999;
            font-size: 16px;
            cursor: pointer;
        }
        .modal-header button:hover { color: #fff; }

        .modal-box p {
            font-size: 11.5px;
            color: #999;
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .modal-box select {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            color: #f5f5f5;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
        }

        .modal-box select option {
            background: #111;
            color: #f5f5f5;
        }

        .seguir-btn {
            background: transparent;
            border: none;
            color: #f5a623;
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
        }
        .seguir-btn:hover { transform: scale(1.15); }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 59, 59, 0.15);
            color: #ff3b3b;
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: 0.5px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .live-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ff3b3b;
            animation: pulso 1.4s infinite;
        }

        @keyframes pulso {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .watch-btn {
            display: inline-block;
            margin-top: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #000;
            background: #fff;
            padding: 5px 12px;
            border-radius: 14px;
            text-decoration: none;
        }
        .watch-btn:hover { background: #ddd; }
    </style>
</head>
<body>

    <a class="kofi-corner" href="https://ko-fi.com/soychris" target="_blank" rel="noopener" title="Apoya el proyecto">☕</a>
    <button class="opciones-corner" id="btn-opciones" title="Opciones">⚙️</button>

    <header>
        <h1>ESPORTS DASHBOARD</h1>
        <div id="reloj">00:00:00</div>
    </header>

    <div class="game-tabs">
        <button class="game-tab active" data-game="valorant">
            <img src="icons/games/valorant.png" alt="Valorant"> Valorant
        </button>
        <button class="game-tab" data-game="lol">
            <img src="icons/games/lol.png" alt="LoL"> LoL
        </button>
        <button class="game-tab" data-game="cs2">
            <img src="icons/games/cs2.png" alt="CS2"> CS2
        </button>
    </div>

    <div class="main-layout">
        <nav class="side-nav">
            <button class="side-tab active" data-view="parches">
                <span class="icon">📝</span><span>Parches</span>
            </button>
            <button class="side-tab" data-view="partidos">
                <span class="icon">📅</span><span>Partidos</span>
            </button>
        </nav>

        <div class="content-panel" id="content-panel">
            <div class="empty-state">Cargando...</div>
        </div>
    </div>

    <div id="estado-actualizacion"></div>

    <div class="modal-overlay oculto" id="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <span id="modal-titulo">PAÍS</span>
                <button id="cerrar-modal">✕</button>
            </div>
            <p id="modal-desc">Selecciona tu país para ajustar el horario y el idioma:</p>
            <select id="selector-pais"></select>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
